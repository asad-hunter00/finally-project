<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMDB Talk - The Movie Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<link rel="icon" href="/logo.svg">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <a href="#" onclick="setNav('general');loadSection('general');return false">
      <img src="/logo.svg" alt="TMDB" style="width:154px">
    </a>
  </div>
  <div class="sidebar-auth">
    <a href="#" class="auth-link" style="color: white; font-size: 16px;">Login</a>
    <a href="#" class="auth-link" style="color: white; font-size: 16px;">Sign Up</a>
  </div>
  <div class="sidebar-section">
    <div class="nav-link" style="color: white;">Categories</div>
    <button class="nav-link" id="nav-general" onclick="setNav('general');loadSection('general')">General</button>
    <button class="nav-link" id="nav-website" onclick="setNav('website');loadSection('website')">Website Support</button>
    <button class="nav-link" id="nav-api" onclick="setNav('api');loadSection('api')">API Support</button>
    <button class="nav-link" id="nav-content" onclick="setNav('content');loadSection('content')">Content Issues</button>
  </div>
  <div class="sidebar-footer">
    <button class="nav-link" onclick="openKbd()">Keyboard Shortcuts</button>
  </div>
</aside>

<main class="main">
  <div class="search-bar">
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="searchInput" placeholder="Search the forums..." onkeydown="if(event.key==='Enter')doSearch()"/>
    </div>
    <a href="#" class="adv-link" onclick="openAdv();return false">Advanced Search</a>
    <button class="search-go" onclick="doSearch()">Search</button>
  </div>
  <div class="page" id="pageContent"></div>
</main>

<!-- Thread Modal -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeOverlay()">
  <div class="modal">
    <div class="modal-hd">
      <div class="modal-hd-left">
        <div class="modal-bc" id="mBc">Support → General</div>
        <div class="modal-title" id="mTitle"></div>
        <div class="modal-date" id="mDate"></div>
      </div>
      <button class="modal-x" onclick="closeOverlay()">×</button>
    </div>
    <div class="modal-sidebar" id="mSidebar"></div>
    <div class="modal-bd" id="mBody"></div>
  </div>
</div>

<!-- Keyboard Shortcuts -->
<div class="kbd-overlay" id="kbdOverlay" onclick="if(event.target===this)closeKbd()">
  <div class="kbd-modal">
    <div class="kbd-hd"><h2>Keyboard Shortcuts</h2><button class="modal-x" onclick="closeKbd()">×</button></div>
    <div class="kbd-bd">
      <div class="kbd-section"><h3>Global</h3>
        <div class="kbd-row"><kbd>s</kbd><span class="kbd-desc">focus search bar</span></div>
        <div class="kbd-row"><kbd>esc</kbd><span class="kbd-desc">close open window</span></div>
        <div class="kbd-row"><kbd>?</kbd><span class="kbd-desc">open keyboard shortcuts</span></div>
      </div>
      <div class="kbd-section"><h3>Navigation</h3>
        <div class="kbd-row"><kbd>→</kbd><span class="kbd-desc">next page</span></div>
        <div class="kbd-row"><kbd>←</kbd><span class="kbd-desc">previous page</span></div>
      </div>
    </div>
    <div class="kbd-footer"><label><input type="checkbox" id="kbdEnabled" checked> Enable Keyboard Shortcuts</label></div>
  </div>
</div>

<!-- Advanced Search -->
<div class="adv-overlay" id="advOverlay" onclick="if(event.target===this)closeAdv()">
  <div class="adv-modal">
    <div class="adv-hd"><h2>Advanced Search</h2><button class="modal-x" onclick="closeAdv()">×</button></div>
    <div class="adv-bd">
      <div class="adv-field"><label>Title / Keyword</label><input id="advQ" placeholder="e.g. Inception…"/></div>
      <div class="adv-2col">
        <div class="adv-field"><label>Type</label>
          <select id="advType"><option value="movie">Movie</option><option value="tv">TV Show</option><option value="person">Person</option></select>
        </div>
        <div class="adv-field"><label>Year</label><input id="advYear" type="number" placeholder="2024"/></div>
      </div>
      <div class="adv-2col">
        <div class="adv-field"><label>Min Rating</label><input id="advMin" type="number" step="0.1" min="0" max="10" placeholder="0–10"/></div>
        <div class="adv-field"><label>Language</label>
          <select id="advLang">
            <option value="">Any</option>
            <option value="en">English</option>
            <option value="fr">French</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
            <option value="zh">Chinese</option>
            <option value="ar">Arabic</option>
          </select>
        </div>
      </div>
      <button class="adv-go" onclick="runAdv()">Search</button>
    </div>
  </div>
</div>

<script src="./main.js"></script>
</body>
</html>
